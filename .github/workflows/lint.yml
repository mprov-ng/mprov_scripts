name: Lint
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # every tracked shell script (image-gen, post-boot, tools); the .mash
      # files are mash scripts, not shell (#47).
      - name: bash -n
        run: |
          git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      # errors only, as in mash and the mPCC.
      - name: ShellCheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck -S error
