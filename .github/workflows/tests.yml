name: Tests
on:
  push:
    branches:
      - master
    paths-ignore:
      # Agent instructions only; they can't affect the tests.
      - 'AGENTS.md'
      - 'CLAUDE.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      # Agent instructions only; they can't affect the tests.
      - 'AGENTS.md'
      - 'CLAUDE.md'
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # The tests run each script in a Rocky 9 container built from
      # tests/Dockerfile.
      - name: Run tests
        run: python -m pytest -v tests
